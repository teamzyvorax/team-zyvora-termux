name: Build and publish ZYVORA APT repository

on:
  push:
    branches: [main]
    paths:
      - 'packages/zyvora/**'
      - '.github/workflows/build-and-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  TERMUX_BUILD_DIR: termux-packages
  SITE_DIR: site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZYVORA
        uses: actions/checkout@v6

      - name: Clone Termux package build system
        run: git clone --depth 1 https://github.com/termux/termux-packages.git "$TERMUX_BUILD_DIR"

      - name: Copy ZYVORA package recipe and assets
        run: |
          rm -rf "$TERMUX_BUILD_DIR/packages/zyvora"
          mkdir -p "$TERMUX_BUILD_DIR/packages/zyvora"
          cp -a packages/zyvora/. "$TERMUX_BUILD_DIR/packages/zyvora/"

      - name: Build ZYVORA package in official Termux Docker environment
        working-directory: ${{ env.TERMUX_BUILD_DIR }}
        run: |
          set -o pipefail
          ./scripts/run-docker.sh ./build-package.sh -f -I zyvora 2>&1 | tee "$GITHUB_WORKSPACE/zyvora-build.log"

      - name: Show build diagnostics on failure
        if: failure()
        run: |
          echo '===== ZYVORA BUILD LOG (last 200 lines) ====='
          tail -n 200 zyvora-build.log || true
          echo '===== PRODUCED DEB FILES ====='
          find "$TERMUX_BUILD_DIR" -type f -name '*.deb' -print || true

      - name: Build APT repository
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev gzip

          rm -rf "$SITE_DIR"
          mkdir -p "$SITE_DIR/apt/pool/main/z/zyvora"

          shopt -s nullglob
          debs=("$TERMUX_BUILD_DIR"/output/zyvora_*.deb)
          if [ "${#debs[@]}" -eq 0 ]; then
            echo "ERROR: no ZYVORA .deb was produced" >&2
            find "$TERMUX_BUILD_DIR" -type f -name '*.deb' -print >&2 || true
            exit 1
          fi
          cp "${debs[@]}" "$SITE_DIR/apt/pool/main/z/zyvora/"

          for arch in aarch64 arm i686 x86_64 all; do
            mkdir -p "$SITE_DIR/apt/dists/stable/main/binary-$arch"
            dpkg-scanpackages -a all "$SITE_DIR/apt/pool/main" /dev/null \
              | gzip -9c > "$SITE_DIR/apt/dists/stable/main/binary-$arch/Packages.gz"
            dpkg-scanpackages -a all "$SITE_DIR/apt/pool/main" /dev/null \
              > "$SITE_DIR/apt/dists/stable/main/binary-$arch/Packages"
          done

          mkdir -p "$SITE_DIR/apt/dists/stable"
          cat > "$SITE_DIR/apt/apt-ftparchive.conf" <<'EOF'
          APT::FTPArchive::Release::Origin "Team Zyvora";
          APT::FTPArchive::Release::Label "ZYVORA TERMUX";
          APT::FTPArchive::Release::Suite "stable";
          APT::FTPArchive::Release::Codename "stable";
          APT::FTPArchive::Release::Architectures "aarch64 arm i686 x86_64 all";
          APT::FTPArchive::Release::Components "main";
          EOF
          apt-ftparchive -c="$SITE_DIR/apt/apt-ftparchive.conf" release "$SITE_DIR/apt/dists/stable" \
            > "$SITE_DIR/apt/dists/stable/Release"

          cat > "$SITE_DIR/index.html" <<'EOF'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZYVORA TERMUX APT</title></head>
          <body><h1>ZYVORA TERMUX APT</h1><p>Official package repository for Team Zyvora.</p><p>Install with <code>pkg install zyvora</code>.</p></body>
          </html>
          EOF

          echo "Published package files:"
          find "$SITE_DIR/apt" -type f -maxdepth 6 -print | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy APT repository
        id: deployment
        uses: actions/deploy-pages@v4
